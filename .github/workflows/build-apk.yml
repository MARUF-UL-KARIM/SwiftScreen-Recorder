name: Build Debug APK

# Every push builds the APK automatically.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (accepts licenses)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # app/build.gradle.kts signs debug builds with ./debug.keystore, which is git-ignored.
      # Cache it so every build is signed with the same key (lets you update the app without uninstalling).
      - name: Restore debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" ScreenCraft-debug.apk
          ls -lh ScreenCraft-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCraft-debug-apk
          path: ScreenCraft-debug.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" ScreenCraft-debug.apk \
            --title "ScreenCraft debug APK #${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}" \
            --latest
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/ScreenCraft-debug.apk" >> "$GITHUB_STEP_SUMMARY"
