name: Build Debug APK

# Every push builds the APK automatically. Can also be started by hand (Actions tab -> Run workflow).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the APK as a GitHub Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Pre-accept Android SDK Licenses
        run: |
          set +e
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a6351dd792de0f6229b69c83906477604" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a733874409b496e731b3cf50463" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # debug.keystore is git-ignored but app/build.gradle.kts signs debug builds with it.
      # Cached so every build uses the same key (lets you update the app without uninstalling).
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # .env is git-ignored; the secrets plugin falls back to .env.example, but make sure it exists.
      - name: Ensure .env exists
        run: '[ -f .env ] || cp .env.example .env'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build debug APK
        id: build
        run: |
          set +e
          BUILD_CMD="./gradlew"
          if [ ! -x "./gradlew" ]; then
            BUILD_CMD="gradle"
          fi
          # one retry covers flaky dependency downloads
          for attempt in 1 2; do
            echo "::group::Build attempt $attempt"
            $BUILD_CMD assembleDebug --stacktrace --no-configuration-cache 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$status" -eq 0 ] && break
            echo "::warning::Build attempt $attempt failed (exit $status)"
          done
          exit $status

      - name: Show the real error in the run summary
        if: failure()
        run: |
          {
            echo "### Build failed - error lines"
            echo '```'
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Could not|Execution failed|not found|License" build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/build/reports/**
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" ScreenCraft-debug.apk
          ls -lh ScreenCraft-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCraft-debug-apk
          path: ScreenCraft-debug.apk
          if-no-files-found: error

      # Needs Settings -> Actions -> General -> Workflow permissions = "Read and write".
      # Failure here does not fail the build; the APK is still in the run's Artifacts.
      - name: Publish APK as GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" ScreenCraft-debug.apk \
            --title "ScreenCraft debug APK #${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}" \
            --clobber \
            --latest || true
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/ScreenCraft-debug.apk" >> "$GITHUB_STEP_SUMMARY"
