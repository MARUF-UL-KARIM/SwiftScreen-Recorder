name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          set -e
          echo "Validating APK file existence and checksum..."
          
          APK_PATH="apk-distribution/app-debug.apk"
          CHECKSUM_PATH="apk-distribution/app-debug.apk.sha256"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH does not exist!"
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty!"
            exit 1
          fi
          
          if [ ! -f "$CHECKSUM_PATH" ]; then
            echo "Error: $CHECKSUM_PATH does not exist!"
            exit 1
          fi
          
          # Verify checksum
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256
          cd ..
          
          # Verify zip archive integrity
          unzip -tq "$APK_PATH"
          echo "APK archive structure is valid."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          APK_PATH="apk-distribution/app-debug.apk"
          
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          echo "Creating GitHub Release with tag: $TAG_NAME..."
          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated release of pre-compiled debug APK from Google AI Studio.
          
          - **File:** app-debug.apk
          - **Size:** $APK_SIZE
          - **SHA-256:** \`$APK_SHA256\`
          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --latest
          
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG_NAME"
          DOWNLOAD_URL="${{ github.server_url }}/${{ github.repository }}/releases/latest/download/app-debug.apk"
          
          echo "Release created successfully: $RELEASE_URL"
          echo "Direct download URL: $DOWNLOAD_URL"
          
          echo "### 🚀 APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`$APK_SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL:** [$DOWNLOAD_URL]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
